<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color role comparison · CU Ways</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="recipes.css"><style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui;background:#eceef2;color:#20242c}header{padding:24px;max-width:1440px;margin:auto}h1{font-size:24px;margin:0 0 8px}header p{margin:8px 0}#panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:16px;max-width:1440px;margin:auto}.sample{min-width:0;padding:24px;background:var(--cu-color-surface-canvas);color:var(--cu-color-text-body);border-radius:12px}.sample h2{margin:0 0 20px;font-size:20px}.sample .card{padding:20px;background:var(--cu-color-surface-card);border:1px solid var(--cu-color-border-default);border-radius:12px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.messages{display:grid;gap:12px;margin-top:20px}.caption{font-size:14px;color:var(--cu-color-text-muted);margin:12px 0}.navigation{margin-bottom:16px}@media(max-width:800px){#panels{grid-template-columns:1fr}.sample{padding:16px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style><header><a href="../index.html">Story library</a><h1>Color role comparison</h1><p>1.9 replacement proposal. Purple removed; human acceptance of the replacement is pending.</p></header><main id="panels"></main><script type="module">
import{action,banner,lifecycleBadge,attachmentTag,evidenceLink,backLink}from'./components.mjs';
for(const theme of ['light','dark']){const section=document.createElement('section');section.className='sample cu-surface';section.dataset.cuTheme=theme;section.innerHTML=`<h2>${theme} · current proposal</h2><div class="card"><div class="row">${action('Confirm',{variant:'primary'})}${action('Add delivery proof',{variant:'secondary'})}${action('View activity',{variant:'tonal'})}${action('Keep job',{variant:'outline'})}${action('Refresh',{variant:'utility',icon:'refresh'})}${action('Got it',{variant:'quiet'})}</div><p class="caption">Commitment · task · supporting task · safe alternative · utility · acknowledgment</p><div class="navigation">${backLink('Back to workspace',{href:'../index.html'})}</div><div class="row">${lifecycleBadge('Accepted')}${lifecycleBadge('In Progress')}${lifecycleBadge('Completed')}${lifecycleBadge('Cancelled')}${attachmentTag()}</div><p class="caption">Same canonical status identities in every story.</p>${evidenceLink('https://example.com/proof/campus-dining')}</div><div class="messages">${banner({tone:'info',title:'Request is processing',body:'You can continue browsing.'})}${banner({tone:'success',title:'Job completed',body:'The final status is confirmed.'})}${banner({tone:'warning',title:'Outcome not confirmed',body:'Check the current status before retrying.'})}${banner({tone:'error',title:'Couldn’t load job',body:'Try again to read the latest details.'})}</div>`;document.querySelector('#panels').append(section);}
</script></html>
