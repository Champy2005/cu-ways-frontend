name: Frontend CI

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - edited
      - synchronize
      - reopened
  push:
    branches:
      - main
      - dev
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  governance:
    name: PR and commit governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate pull request branch name
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          branch_pattern='^((dependabot|renovate|codex|copilot)/.+|(feat|feature|fix|bugfix|hotfix|docs|style|refactor|perf|test|build|ci|chore|revert|release|epic|story|task)/[A-Za-z0-9][A-Za-z0-9._/-]*)$'

          if [[ "$BRANCH_NAME" != "dev" && "$BRANCH_NAME" != "main" && ! "$BRANCH_NAME" =~ $branch_pattern && ! "$BRANCH_NAME" =~ ^revert-[0-9]+- ]]; then
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Use <type>/<description>, for example feat/US-001-registration or fix/login-error."
            exit 1
          fi

      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      - name: Validate commit messages
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          legacy_pre_policy_sha="f4c1338568147ffb61a517fa3f4933a0c6f1281e"

          lint_range() {
            local range="$1"
            local commit_count=0

            while IFS= read -r commit_sha; do
              [[ -z "$commit_sha" ]] && continue
              commit_count=$((commit_count + 1))

              if [[ "$commit_sha" == "$legacy_pre_policy_sha" ]]; then
                echo "Skipping pre-policy commit $commit_sha (Add AGENTS.md)."
                continue
              fi

              echo "Linting commit $commit_sha"
              git show --quiet --format=%B "$commit_sha" | pnpm exec commitlint --verbose
            done < <(git rev-list --reverse "$range")

            if [[ "$commit_count" -eq 0 ]]; then
              echo "No commits found in range $range."
            fi
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            lint_range "$BASE_SHA..$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            lint_range "$BEFORE_SHA..$HEAD_SHA"
          else
            lint_range "$HEAD_SHA^!"
          fi

  quality:
    name: Formatting, lint, and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate GitHub Actions syntax
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting
        run: pnpm format:check

      - name: Run ESLint and complexity rules
        run: pnpm lint

      - name: Check generated route and TypeScript types
        run: pnpm typecheck

  tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run current frontend tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  dependency-security:
    name: Dependency vulnerability gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit the complete dependency tree
        run: pnpm security:audit

      - name: Reject newly introduced high-severity dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for committed secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --redact --no-banner /github/workspace

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.{js,jsx,ts,tsx}', '*.ts', '*.mts', '*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Create strict production build
        env:
          BACKEND_API_URL: http://127.0.0.1:8081
        run: pnpm build

      - name: Package verified build output
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        run: tar --exclude='.next/cache' -czf frontend-build.tar.gz .next public package.json pnpm-lock.yaml next.config.ts

      - name: Upload verified build output
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend-build.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  quality-gate:
    name: Frontend quality gate
    if: always()
    needs:
      - governance
      - quality
      - tests
      - dependency-security
      - secret-scan
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm every required frontend check passed
        shell: bash
        env:
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-security.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          failed=0

          check_result() {
            local name="$1"
            local result="$2"
            echo "$name: $result"
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          }

          check_result "Governance" "$GOVERNANCE_RESULT"
          check_result "Quality" "$QUALITY_RESULT"
          check_result "Tests" "$TEST_RESULT"
          check_result "Dependencies" "$DEPENDENCY_RESULT"
          check_result "Secrets" "$SECRET_RESULT"
          check_result "Build" "$BUILD_RESULT"

          if [[ "$failed" -ne 0 ]]; then
            echo "One or more required frontend checks did not pass."
            exit 1
          fi

          echo "All required frontend checks passed."
