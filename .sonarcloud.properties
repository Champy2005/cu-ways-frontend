# SonarQube Cloud automatic analysis settings.
#
# src/lib/api/generated/backend.ts is written by openapi-typescript from the
# backend OpenAPI document (`pnpm generate:api`) and must not be edited by hand.
# Its repeated type shapes are generator output, not copied code, so exclude it
# from duplication detection only. It is still analysed for issues, and the
# duplication threshold for hand-written code is unchanged.
sonar.cpd.exclusions=src/lib/api/generated/backend.ts
